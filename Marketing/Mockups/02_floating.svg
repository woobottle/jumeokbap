<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Mock app content area -->
  <rect x="180" y="220" width="2520" height="1260" rx="24" fill="#0b1220" stroke="#111827"/>
  <rect x="220" y="300" width="2440" height="1080" rx="16" fill="#111827"/>
  <!-- Floating timer window -->
  <g filter="url(#shadow)">
    <rect x="2240" y="260" width="120" height="60" rx="14" fill="#090f1a" stroke="#1f2937"/>
    <text x="2268" y="300" fill="#f8fafc" font-size="28" font-family="-apple-system, SF Pro Text, system-ui">25:00</text>
  </g>
  <!-- Caption -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" rx="16" ry="16" width="1200" height="140" fill="#0b1220" opacity="0.75"/>
    <text x="160" y="230" fill="#f8fafc" font-family="-apple-system, SF Pro Display, system-ui" font-size="56" font-weight="700">작고 가벼운 플로팅 타이머</text>
  </g>
</svg>

