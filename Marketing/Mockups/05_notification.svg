<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Notification banner mock -->
  <g filter="url(#shadow)">
    <rect x="1680" y="100" width="900" height="120" rx="18" fill="#0b1220" stroke="#111827"/>
    <circle cx="1725" cy="160" r="28" fill="#f59e0b"/>
    <text x="1768" y="152" fill="#f8fafc" font-size="28" font-family="-apple-system, SF Pro Text, system-ui" font-weight="700">주먹밥</text>
    <text x="1768" y="184" fill="#e5e7eb" font-size="24" font-family="-apple-system, SF Pro Text, system-ui">세션이 종료되었습니다</text>
  </g>
  <!-- Caption -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" rx="16" ry="16" width="1100" height="140" fill="#0b1220" opacity="0.75"/>
    <text x="160" y="230" fill="#f8fafc" font-family="-apple-system, SF Pro Display, system-ui" font-size="56" font-weight="700">세션 종료는 알림으로</text>
  </g>
</svg>

