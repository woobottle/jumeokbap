<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Desktop wallpaper pattern -->
  <g opacity="0.15">
    <circle cx="300" cy="400" r="220" fill="#94a3b8"/>
    <circle cx="700" cy="250" r="120" fill="#334155"/>
    <circle cx="1200" cy="520" r="180" fill="#64748b"/>
    <circle cx="2200" cy="300" r="160" fill="#475569"/>
  </g>
  <!-- Menu bar strip -->
  <rect x="0" y="0" width="2880" height="64" fill="#0b1220"/>
  <!-- Left items (mock) -->
  <g fill="#cbd5e1" font-family="-apple-system, SF Pro Display, system-ui" font-size="24" opacity="0.85">
    <text x="24" y="42"></text>
    <text x="64" y="42">Jumeokbap</text>
    <text x="220" y="42" opacity="0.7">File</text>
    <text x="290" y="42" opacity="0.7">Edit</text>
    <text x="360" y="42" opacity="0.7">View</text>
  </g>
  <!-- Right status items (mock) -->
  <g fill="#cbd5e1" font-family="-apple-system, SF Pro Text, system-ui" font-size="22" opacity="0.9">
    <text x="2300" y="40" opacity="0.7">Wi‑Fi</text>
    <text x="2400" y="40" opacity="0.7">🔊</text>
    <text x="2460" y="40" opacity="0.7">🔋100%</text>
    <!-- Our app time -->
    <rect x="2560" y="14" rx="8" ry="8" width="270" height="36" fill="#111827" stroke="#1f2937"/>
    <text x="2578" y="40" font-size="22" fill="#f8fafc">25:00</text>
  </g>
  <!-- Caption -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" rx="16" ry="16" width="900" height="140" fill="#0b1220" opacity="0.75"/>
    <text x="160" y="230" fill="#f8fafc" font-family="-apple-system, SF Pro Display, system-ui" font-size="56" font-weight="700">메뉴바에서 한눈에 남은 시간</text>
  </g>
</svg>

