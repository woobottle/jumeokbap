<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <style>
      .title{fill:#f8fafc;font:700 56px '-apple-system', 'SF Pro Display', system-ui}
      .h{fill:#e5e7eb;font:600 22px '-apple-system','SF Pro Text',system-ui}
      .t{fill:#cbd5e1;font:400 18px '-apple-system','SF Pro Text',system-ui}
      .btn{fill:#111827;stroke:#1f2937}
      .btnText{fill:#e5e7eb;font:500 16px '-apple-system','SF Pro Text',system-ui}
      .divider{fill:#1f2937}
      .sliderTrack{fill:#1f2937}
      .sliderFill{fill:#60a5fa}
      .toggleBg{fill:#111827;stroke:#1f2937}
      .toggleDot{fill:#22c55e}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Caption -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" rx="16" ry="16" width="1200" height="140" fill="#0b1220" opacity="0.75"/>
    <text x="160" y="230" class="title">필요한 설정만 간단하게</text>
  </g>

  <!-- Popover mirroring SettingsView.swift layout (width ~280, padding ~16) -->
  <g filter="url(#shadow)">
    <rect x="2080" y="160" width="300" height="540" rx="16" fill="#0b1220" stroke="#111827"/>
    <g transform="translate(2100,190)">
      <!-- timer presets (min): -->
      <text class="h" x="0" y="0">timer presets (min):</text>
      <g transform="translate(0,18)">
        <g transform="translate(0,20)">
          <rect class="btn" x="0" y="0" width="44" height="28" rx="8"/>
          <text class="btnText" x="15" y="19">1</text>
        </g>
        <g transform="translate(52,20)">
          <rect class="btn" x="0" y="0" width="44" height="28" rx="8"/>
          <text class="btnText" x="14" y="19">2</text>
        </g>
        <g transform="translate(104,20)">
          <rect class="btn" x="0" y="0" width="44" height="28" rx="8"/>
          <text class="btnText" x="14" y="19">5</text>
        </g>
        <g transform="translate(156,20)">
          <rect class="btn" x="0" y="0" width="52" height="28" rx="8"/>
          <text class="btnText" x="14" y="19">10</text>
        </g>
        <g transform="translate(212,20)">
          <rect class="btn" x="0" y="0" width="56" height="28" rx="8" fill="#2563eb"/>
          <text class="btnText" x="18" y="19">25</text>
        </g>
      </g>

      <!-- Divider -->
      <rect class="divider" x="0" y="78" width="260" height="1"/>

      <!-- timer controls: -->
      <g transform="translate(0,94)">
        <text class="h" x="0" y="0">timer controls:</text>
        <g transform="translate(0,20)">
          <rect x="0" y="0" width="64" height="30" rx="8" fill="#2563eb"/>
          <text class="btnText" x="16" y="20">시작</text>

          <g transform="translate(76,0)">
            <rect class="btn" x="0" y="0" width="64" height="30" rx="8"/>
            <text class="btnText" x="16" y="20">정지</text>
          </g>
          <g transform="translate(152,0)">
            <rect class="btn" x="0" y="0" width="64" height="30" rx="8"/>
            <text class="btnText" x="16" y="20">리셋</text>
          </g>
        </g>
      </g>

      <!-- Divider -->
      <rect class="divider" x="0" y="176" width="260" height="1"/>

      <!-- alarm volume: + slider + toggle -->
      <g transform="translate(0,192)">
        <text class="h" x="0" y="0">alarm volume:</text>
        <g transform="translate(0,16)">
          <rect class="sliderTrack" x="0" y="0" width="260" height="6" rx="3"/>
          <rect class="sliderFill" x="0" y="0" width="130" height="6" rx="3"/>
          <circle cx="130" cy="3" r="10" fill="#93c5fd"/>
        </g>
        <g transform="translate(0,46)">
          <text class="t" x="0" y="14">automatically mute after 5 seconds</text>
          <rect class="toggleBg" x="204" y="-6" width="48" height="28" rx="14"/>
          <circle class="toggleDot" cx="228" cy="8" r="10"/>
        </g>
      </g>

      <!-- Divider -->
      <rect class="divider" x="0" y="294" width="260" height="1"/>

      <!-- floating display toggle -->
      <g transform="translate(0,310)">
        <text class="t" x="0" y="14">floating display</text>
        <rect class="toggleBg" x="204" y="-6" width="48" height="28" rx="14"/>
        <circle class="toggleDot" cx="228" cy="8" r="10"/>
      </g>

      <!-- Divider -->
      <rect class="divider" x="0" y="352" width="260" height="1"/>

      <!-- system settings header + button -->
      <g transform="translate(0,368)">
        <text class="h" x="0" y="0">system settings:</text>
        <g transform="translate(0,16)">
          <rect class="btn" x="0" y="0" width="140" height="30" rx="8"/>
          <text class="btnText" x="18" y="20">알림 설정 열기</text>
        </g>
      </g>
    </g>
  </g>
</svg>

