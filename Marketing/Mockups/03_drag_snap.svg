<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Workspace mock -->
  <rect x="160" y="160" width="2560" height="1480" rx="28" fill="#0b1220" stroke="#111827"/>
  <!-- Floating timer current position -->
  <g filter="url(#shadow)">
    <rect x="1340" y="300" width="120" height="60" rx="14" fill="#090f1a" stroke="#1f2937"/>
    <text x="1368" y="340" fill="#f8fafc" font-size="28" font-family="-apple-system, SF Pro Text, system-ui">25:00</text>
  </g>
  <!-- Arrow to snap position (right edge) -->
  <line x1="1400" y1="330" x2="2640" y2="330" stroke="#93c5fd" stroke-width="6" marker-end="url(#arrow)" opacity="0.9"/>
  <rect x="2648" y="300" width="120" height="60" rx="14" fill="#0b1220" stroke="#1f2937" opacity="0.35"/>
  <!-- Caption -->
  <g filter="url(#shadow)">
    <rect x="120" y="160" rx="16" ry="16" width="1200" height="140" fill="#0b1220" opacity="0.75"/>
    <text x="160" y="230" fill="#f8fafc" font-family="-apple-system, SF Pro Display, system-ui" font-size="56" font-weight="700">드래그로 이동, 가장자리 스냅</text>
  </g>
</svg>

